<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>アシストマップ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link rel="apple-touch-icon" href="icon-512.png">
    <link rel="icon" type="image/png" href="icon-512.png">
    <link rel="manifest" href="manifest.json">
    
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; cursor: crosshair; overflow: hidden; }
        #map-container { width: 100vw; height: 100vh; overflow: hidden; position: relative; background: #ddd; }
        #map { width: 100%; height: 100%; transition: transform 0.1s ease-out; }
        .leaflet-container { cursor: crosshair !important; }
        
        .control-panel {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); 
            padding: 5px 8px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column; 
            gap: 5px;
            align-items: stretch; 
            font-size: 12px;
        }

        .input-group { 
            display: flex; 
            gap: 2px;
            width: 100%; 
        }
        input { 
            flex: 1; 
            padding: 5px;
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 12px;
            min-width: 80px;
        }
        button { 
            padding: 5px 8px;
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 12px;
            white-space: nowrap; 
        }
        
        .btn-row { 
            display: flex; 
            gap: 2px;
            flex-wrap: nowrap; 
            width: 100%; 
            justify-content: space-between;
        }
        .btn-clear { background: #6c757d; } 
        .active-mode { background: #dc3545 !important; }

        .btn-row button {
            flex-grow: 1; 
            flex-basis: 0;
            min-width: 0; 
        }
        
        .info-panel { 
            background: #f0f4f8; 
            padding: 3px 5px;
            border-radius: 6px; 
            border: 1px solid #d1d9e6;
            width: 100%; 
            text-align: center; 
            margin-top: 5px;
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        .distance-display {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .dist-label { font-size: 8px; color: #666; display: block; text-align: center; }
        .dist-value { font-size: 13px; font-weight: bold; color: #333; text-align: center; }
        .total-dist { color: #d32f2f; }
        
        .locate-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            border: none;
            font-size: 24px;
        }

        /* 回転補正用クラス */
        .counter-rotate {
            transition: transform 0.1s ease-out;
        }

        @media (min-width: 769px) {
            .control-panel {
                flex-direction: row; 
                flex-wrap: nowrap; 
                align-items: center;
                justify-content: flex-start; 
                padding: 8px 10px;
                gap: 8px;
            }
            .input-group {
                flex-grow: 1; 
                max-width: none; 
            }
            .btn-row {
                flex-grow: 0; 
                flex-wrap: nowrap; 
                margin-left: auto; 
                width: auto;
                gap: 5px;
            }
            .btn-row button {
                flex-grow: 0; 
                min-width: unset;
                padding: 7px 12px;
            }
            .info-panel {
                width: auto; 
                margin-left: 10px; 
                flex-shrink: 0; 
                margin-top: 0;
                padding: 4px 6px;
            }
        }
    </style>
</head>
<body>
    <div class="control-panel">
        <div class="input-group">
            <input type="text" id="addressInput" placeholder="住所・施設・座標">
            <button onclick="searchAddress()">検索</button>
        </div>
        <div class="btn-row">
            <button class="btn-clear" onclick="popPin()">↩️1つ消す</button>
            <button id="btnNup" class="active-mode" onclick="setNorthUp()">▲北上</button>
            <button id="btnHup" onclick="setHeadingUp()">▼進行</button>
        </div>
        <div class="info-panel">
            <div class="distance-display">
                <span class="dist-label">合計距離: </span>
                <span class="dist-value total-dist" id="totalDistance">0.00</span>
                <span class="dist-label"> km</span>
            </div>
        </div>
    </div>

    <button class="locate-btn" onclick="goToCurrentLocation()" title="現在地を表示">🎯</button>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <script>
        const mapElement = document.getElementById('map');
        const map = L.map('map', { zoomControl: false }).setView([34.8833, 135.7000], 15);
        
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let markers = [];
        let polyline = L.polyline([], {color: '#d32f2f', weight: 5, opacity: 0.8}).addTo(map);
        let distances = []; 
        let currentLocationMarker = null;
        let isHeadingUp = false;
        let currentHeading = 0;

        // GPS監視
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const currentLatLng = L.latLng(lat, lng);

                    if (currentLocationMarker) {
                        currentLocationMarker.setLatLng(currentLatLng);
                    } else {
                        currentLocationMarker = L.marker(currentLatLng, {
                            icon: L.divIcon({
                                className: 'current-location-icon counter-rotate',
                                html: '<div style="background-color: #007bff; border-radius: 50%; width: 16px; height: 16px; border: 2px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.5);"></div>',
                                iconSize: [20, 20],
                                iconAnchor: [10, 10]
                            })
                        }).addTo(map);
                    }
                    if (isHeadingUp) {
                        map.panTo(currentLatLng);
                    }
                },
                (error) => console.error(error),
                { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
            );
        }

        // 方位情報の取得 (Heading Up用)
        window.addEventListener('deviceorientationabs', handleOrientation, true);
        window.addEventListener('deviceorientation', handleOrientation, true);

        function handleOrientation(event) {
            if (!isHeadingUp) return;

            let heading = 0;
            if (event.webkitCompassHeading) {
                heading = event.webkitCompassHeading; // iOS
            } else if (event.absolute && event.alpha) {
                heading = 360 - event.alpha; // Android
            } else {
                return;
            }

            if (Math.abs(currentHeading - heading) > 2) { // チャタリング防止
                currentHeading = heading;
                rotateMap(currentHeading);
            }
        }

        function rotateMap(deg) {
            mapElement.style.transform = `rotate(${-deg}deg)`;
            // アイコンやテキストが逆さまにならないよう補正
            const elements = document.querySelectorAll('.counter-rotate, .leaflet-marker-icon, .leaflet-popup');
            elements.forEach(el => {
                el.style.transform = `rotate(${deg}deg)`;
            });
        }

        function setNorthUp() {
            isHeadingUp = false;
            currentHeading = 0;
            rotateMap(0);
            document.getElementById('btnNup').classList.add('active-mode');
            document.getElementById('btnHup').classList.remove('active-mode');
        }

        async function setHeadingUp() {
            // iOSなどのブラウザ制限対応（ユーザー操作による許可が必要な場合があるため）
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                const permission = await DeviceOrientationEvent.requestPermission();
                if (permission !== 'granted') {
                    alert('方位情報の利用が許可されませんでした。');
                    return;
                }
            }
            isHeadingUp = true;
            document.getElementById('btnHup').classList.add('active-mode');
            document.getElementById('btnNup').classList.remove('active-mode');
            goToCurrentLocation();
        }

        function goToCurrentLocation() {
            if (currentLocationMarker) {
                const pos = currentLocationMarker.getLatLng();
                map.setView(pos, 17, { animate: true });
            } else {
                alert("現在地を取得中です。");
            }
        }

        async function searchAddress() {
            const address = document.getElementById('addressInput').value;
            if (!address) return;
            const latLngRegex = /^(-?\d+(\.\d+)?),\s*(-?\d+(\.\d+)?)$|^(-?\d+(\.\d+)?)\s+(-?\d+(\.\d+)?)$/;
            const match = address.match(latLngRegex);
            if (match) {
                const lat = parseFloat(match[1] || match[5]);
                const lng = parseFloat(match[3] || match[7]);
                addPin(L.latLng(lat, lng));
                map.setView([lat, lng], 16);
                return;
            }
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
                const data = await response.json();
                if (data.length > 0) {
                    const pos = L.latLng(parseFloat(data[0].lat), parseFloat(data[0].lon));
                    map.setView(pos, 16);
                    addPin(pos);
                }
            } catch (e) { alert("検索エラー"); }
        }

        function addPin(latlng) {
            const marker = L.marker(latlng).addTo(map);
            // 地図回転中にピンを追加しても正しく表示されるよう補正
            if (isHeadingUp) {
                marker._icon.style.transform += ` rotate(${currentHeading}deg)`;
            }
            if (markers.length > 0) {
                const lastPos = markers[markers.length - 1].getLatLng();
                distances.push(lastPos.distanceTo(latlng));
            }
            markers.push(marker);
            polyline.addLatLng(latlng);
            updateDisplay(); 
        }

        function popPin() {
            if (markers.length === 0) return;
            map.removeLayer(markers.pop());
            const latlngs = polyline.getLatLngs();
            latlngs.pop();
            polyline.setLatLngs(latlngs);
            distances.pop();
            updateDisplay(); 
        }

        function updateDisplay() {
            const total = distances.reduce((a, b) => a + b, 0); 
            document.getElementById('totalDistance').innerText = (total / 1000).toFixed(2); 
        }

        map.on('click', e => addPin(e.latlng));

        updateDisplay();
    </script>
</body>
</html>
